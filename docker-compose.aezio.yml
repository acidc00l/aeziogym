# AezioGym en producción: se añade al docker-compose.yml de siempre.
#
#   docker compose -f docker-compose.yml -f docker-compose.aezio.yml up -d --build
#
# Qué cambia respecto al compose base:
#   - Imágenes construidas aquí (nada se descarga de ghcr.io/duartesantos8).
#   - La web escucha solo en 127.0.0.1 y cuelga de la red externa red_proxy_npm (Nginx Proxy
#     Manager llega por esa red; desde la red local no se salta la puerta de acceso).
#   - Clips de ejercicio en WebP (VITE_CLIP_EXT=webp).
#   - Los medios de ejercicios (Gym visual, licencia de Aezio) NO van en el repositorio ni en la
#     imagen: se montan en /exercise-media/ desde MEDIA_DIR (por defecto ./media). Sin servicio
#     «media» que descargue nada.
# El entorno del api (secretos, ORIGIN, RP_ID…) sigue viniendo de su archivo de entorno de siempre,
# que no se versiona. Las funciones de openGym que no ofrecemos están apagadas en docker-compose.yml.

services:
  api:
    image: opengym-api:local
    container_name: opengym-api
    labels:
      - "diun.enable=false"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "-T", "5", "http://127.0.0.1:${PORT:-3000}/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    image: opengym-web:local
    container_name: opengym-web
    labels:
      - "diun.enable=false"
    build:
      args:
        VITE_CLIP_EXT: webp
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8080}:${NGINX_PORT:-80}"
    volumes:
      - ${MEDIA_DIR:-./media}:/usr/share/nginx/html/exercise-media:ro
    networks:
      - default
      - red_proxy_npm
    healthcheck:
      test: ["CMD", "wget", "-qO-", "-T", "5", "http://127.0.0.1:${NGINX_PORT:-80}/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  red_proxy_npm:
    external: true
