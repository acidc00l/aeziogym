name: opengym

services:
  media:
    image: alpine/git
    labels:
      - "diun.enable=false"
    volumes:
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Downloading exercise media (~140 MB, one time)…"
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "✓ Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "✓ Exercise media already present — skipping download."
        fi
    restart: "no"

  api:
    build: ./api
    image: opengym-api:local
    container_name: opengym-api
    labels:
      - "diun.enable=false"
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "-T", "5", "http://127.0.0.1:3000/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - PORT=3000
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    networks:
      - default

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: opengym-web:local
    container_name: opengym-web
    labels:
      - "diun.enable=false"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-m", "5", "http://127.0.0.1/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      # Solo en la propia Pi: NPM llega por la red de Docker; desde la red local el puerto se saltaba la puerta de gym.aezio.website
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro
      - ./media/webp:/usr/share/nginx/html/webp:ro
    networks:
      - default
      - red_proxy_npm

networks:
  red_proxy_npm:
    external: true